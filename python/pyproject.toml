[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aiokey"
description = "AI-O Key のデータ生成・評価・学習（変換エンジンは Rust の aiokey-engine を使う）"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = [
  "mwparserfromhell==0.7.2",
  "sudachidict-core==20261015",
  "sudachipy==0.7.0",
]

[project.scripts]
aiokey = "aiokey.__main__:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.maturin]
manifest-path = "../crates/aiokey-py/Cargo.toml"
module-name = "aiokey._engine"
python-source = "src"
features = ["extension-module"]
# llama.cpp を含むので、開発用のインストールでも最適化してビルドする（デバッグビルドの推論はとても遅い）
profile = "release"

[tool.uv]
# Rust 側（aiokey-engine / aiokey-py）が変わったら拡張モジュールを作り直す
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../Cargo.toml" },
  { file = "../crates/aiokey-engine/**/*.rs" },
  { file = "../crates/aiokey-engine/Cargo.toml" },
  { file = "../crates/aiokey-py/**/*.rs" },
  { file = "../crates/aiokey-py/Cargo.toml" },
  { file = "../crates/aiokey-dictbuild/**/*.rs" },
  { file = "../crates/aiokey-dictbuild/data/*" },
  { file = "../crates/aiokey-scorer/**/*.rs" },
  { file = "../crates/aiokey-scorer/Cargo.toml" },
]
