[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aiokey"
description = "AI-O Key のデータ生成・評価・学習（変換エンジンは Rust の aiokey-engine を使う）"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["version"]
dependencies = [
  "mwparserfromhell==0.7.2",
  "sudachidict-core==20261015",
  "sudachipy==0.7.0",
]

# 段2の学習（python -m aiokey train）に使う。torch は CPU 用と CUDA 用のどちらかを選ぶ：
#   dev コンテナと CI は --extra cpu、docker/train.Dockerfile（GPU）は --extra cuda
[project.optional-dependencies]
cpu = [
  "torch==2.11.0",
  "transformers==4.57.6",
  # GGUF の書き出し（llama.cpp の convert_hf_to_gguf.py と gguf-py）が使う
  "numpy~=2.2.6",
  "sentencepiece>=0.1.98,<0.3.0",
  "protobuf>=4.21.0,<5.0.0",
  "pyyaml>=5.1",
  "tqdm>=4.27",
  "requests>=2.25",
]
cuda = [
  "torch==2.11.0",
  "transformers==4.57.6",
  "numpy~=2.2.6",
  "sentencepiece>=0.1.98,<0.3.0",
  "protobuf>=4.21.0,<5.0.0",
  "pyyaml>=5.1",
  "tqdm>=4.27",
  "requests>=2.25",
]

[project.scripts]
aiokey = "aiokey.__main__:main"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.maturin]
manifest-path = "../crates/aiokey-py/Cargo.toml"
module-name = "aiokey._engine"
python-source = "src"
features = ["extension-module"]
# llama.cpp を含むので、開発用のインストールでも最適化してビルドする（デバッグビルドの推論はとても遅い）
profile = "release"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
# Rust 側（aiokey-engine / aiokey-py）が変わったら拡張モジュールを作り直す
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../Cargo.toml" },
  { file = "../crates/aiokey-engine/**/*.rs" },
  { file = "../crates/aiokey-engine/Cargo.toml" },
  { file = "../crates/aiokey-py/**/*.rs" },
  { file = "../crates/aiokey-py/Cargo.toml" },
  { file = "../crates/aiokey-dictbuild/**/*.rs" },
  { file = "../crates/aiokey-dictbuild/data/*" },
  { file = "../crates/aiokey-scorer/**/*.rs" },
  { file = "../crates/aiokey-scorer/Cargo.toml" },
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
