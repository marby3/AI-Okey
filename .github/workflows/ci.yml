name: CI

on:
  # 1 人開発の private リポジトリなので、PR 用の起動は重ねず push だけで動かす
  # （PR の検査欄には同じコミットの結果が出る）
  push:
    branches: ["**"]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Cache Mozc dictionary data
        uses: actions/cache@v4
        with:
          path: data/mozc
          key: mozc-${{ hashFiles('scripts/mozc.sha256') }}
      - name: Fetch Mozc dictionary data
        run: bash scripts/fetch-mozc.sh
      - uses: astral-sh/setup-uv@v6
      - name: Cache zenz GGUF
        uses: actions/cache@v4
        with:
          path: |
            data/zenz-v2.5-xsmall
            data/models
          key: zenz-${{ hashFiles('scripts/zenz.sha256', 'scripts/fetch-zenz.sh', 'scripts/convert_zenz.py') }}
      - name: Fetch and convert zenz
        run: bash scripts/fetch-zenz.sh
      - name: Test portable crates
        run: cargo test-portable
      - name: Repository layout tests
        run: uv run --no-project --python 3.12 --with pytest==8.4.2 pytest tests/repo -q
      - name: Python tests (aiokey package)
        working-directory: python
        # 学習のテストに torch（CPU 版）が要る
        run: uv run --python 3.12 --extra cpu pytest -q

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build (x64)
        run: cargo build --workspace --exclude aiokey-py
      - name: Build TSF (x86)
        run: cargo build -p aiokey-tsf --target i686-pc-windows-msvc
      - name: Test server
        run: cargo test -p aiokey-server
