name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # protoc は版を固定して取る（以前の Action は 23.x を見つけられなくなった。#37）
      - name: Install protoc
        shell: bash
        run: bash scripts/fetch-protoc.sh
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          # v0.1.0-rc.1 のようなプレリリースは、接尾辞を除いて比べる
          tag="${GITHUB_REF_NAME%%-*}"
          test "v$version" = "$tag" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - name: Build
        run: |
          cargo build --release -p aiokey-tsf -p aiokey-server -p aiokey-ui -p aiokey-launcher -p aiokey-cli
          cargo build --release -p aiokey-tsf --target i686-pc-windows-msvc

      - name: Build dictionary
        shell: bash
        run: |
          bash scripts/fetch-mozc.sh
          cargo run --release -p aiokey-dictbuild -- --mozc data/mozc --out aiokey.dic

      - name: Package
        shell: pwsh
        run: |
          $out = "aiokey-$env:GITHUB_REF_NAME-windows"
          New-Item -ItemType Directory -Force "$out/x86" | Out-Null
          Copy-Item target/release/aiokey.dll, target/release/aiokey-server.exe, target/release/aiokey-ui.exe, target/release/aiokey-launcher.exe, target/release/aiokey-cli.exe $out
          Copy-Item target/i686-pc-windows-msvc/release/aiokey.dll "$out/x86"
          Copy-Item LICENSE, NOTICE, aiokey.dic $out
          Copy-Item data/mozc/README.txt "$out/MOZC-DICTIONARY-README.txt"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # v1.0.0（実機で打てる最初の版）より前と、-rc などの付いた版はプレリリースにする
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "aiokey-$GITHUB_REF_NAME-windows.zip" aiokey.dic \
            --title "AI-O Key $GITHUB_REF_NAME" --generate-notes $prerelease

  linux-cli:
    # Windows のジョブが Release を作ったあとに、Linux 版の aiokey-cli を足す
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build and upload aiokey-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p aiokey-cli
          name="aiokey-cli-$GITHUB_REF_NAME-linux-x86_64"
          cp target/release/aiokey-cli "$name"
          gh release upload "$GITHUB_REF_NAME" "$name"
